<!DOCTYPE html>
<html>
<head>
<style>
.boardGrid {
  display: grid;
  grid-template-columns: 1fr;
  width: 800px; /* test width */
  background: #110e14;
  gap: 0;
}
.choiceCardWrapper {
  position: relative;
  border: 1px solid red;
  height: 100px;
}
.orMarker {
  position: absolute;
  width: 20px;
  height: 20px;
  background: gold;
  transform: translate(-50%, -50%);
  z-index: 10;
}

/* Base: Mobile (1 col) */
.orMarker {
  top: 100%;
  left: 50%;
}

/* Tablet (2 col) */
@media (min-width: 400px) {
  .boardGrid { grid-template-columns: repeat(2, 1fr); }
  .orMarker {
    top: 50%;
    left: 100%;
  }
  .choiceCardWrapper:nth-child(2n) .orMarker {
    top: 100%;
    left: 0%;
  }
}

/* Desktop (4 col) */
@media (min-width: 800px) {
  .boardGrid { grid-template-columns: repeat(4, 1fr); }
  
  /* Reset the 2n rule from tablet */
  .choiceCardWrapper:nth-child(2n) .orMarker {
    top: 50%;
    left: 100%;
  }
  
  /* Apply 4n rule */
  .choiceCardWrapper:nth-child(4n) .orMarker {
    top: 100%;
    left: -100%;
  }
}
</style>
</head>
<body>
<div class="boardGrid">
  <div class="choiceCardWrapper">1<div class="orMarker"></div></div>
  <div class="choiceCardWrapper">2<div class="orMarker"></div></div>
  <div class="choiceCardWrapper">3<div class="orMarker"></div></div>
  <div class="choiceCardWrapper">4<div class="orMarker"></div></div>
  <div class="choiceCardWrapper">5<div class="orMarker"></div></div>
  <div class="choiceCardWrapper">6</div>
</div>
</body>
</html>
