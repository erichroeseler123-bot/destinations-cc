name: Deploy Juneau Flight Deck

on:
  push:
    branches: [main]
    paths:
      - 'apps/juneauflightdeck/**'
      - '.github/workflows/deploy-juneauflightdeck.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/juneauflightdeck/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-juneauflightdeck-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.head_ref == 'deploy-suite-production-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/juneauflightdeck
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
      VERCEL_PROJECT_ID: prj_7nY8notLHK8Fh5TkSwli9qXUDhxA
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Lock Vercel project to standalone app root
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"rootDirectory":"apps/juneauflightdeck","sourceFilesOutsideRootDirectory":false}'

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build standalone production app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy standalone production app
        id: deploy
        run: |
          set -o pipefail
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel-deploy.txt
          DEPLOYMENT_URL=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.txt | tail -n 1)
          test -n "$DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Pin Juneau domains to standalone deployment
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" juneauflightdeck.com --token=${{ secrets.VERCEL_TOKEN }}
          vercel alias set "${{ steps.deploy.outputs.url }}" www.juneauflightdeck.com --token=${{ secrets.VERCEL_TOKEN }}
