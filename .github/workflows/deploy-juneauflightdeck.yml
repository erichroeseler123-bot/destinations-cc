name: Deploy Juneau Flight Deck

on:
  push:
    branches: [main]
    paths:
      - 'apps/juneauflightdeck/**'
      - '.github/workflows/deploy-juneauflightdeck.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-juneauflightdeck-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
      VERCEL_PROJECT_ID: prj_7nY8notLHK8Fh5TkSwli9qXUDhxA
      VERCEL_TEAM_SLUG: erichroeseler123-bots-projects
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Lock Vercel project to Juneau app root
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"framework":"nextjs","rootDirectory":"apps/juneauflightdeck","sourceFilesOutsideRootDirectory":true,"commandForIgnoringBuildStep":"node ../../scripts/vercel-ignore-monorepo.mjs"}'

      - name: Create Vercel production deployment from exact Git commit
        id: deploy
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"juneauflightdeck\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"erichroeseler123-bot\",\"repo\":\"destinations-cc\",\"ref\":\"${GITHUB_SHA}\"},\"projectSettings\":{\"framework\":\"nextjs\",\"rootDirectory\":\"apps/juneauflightdeck\",\"sourceFilesOutsideRootDirectory\":true}}" \
            > /tmp/vercel-deployment.json
          DEPLOYMENT_ID=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.id) process.exit(1); console.log(j.id)")
          DEPLOYMENT_URL=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.url) process.exit(1); console.log('https://'+j.url)")
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created $DEPLOYMENT_ID at $DEPLOYMENT_URL"

      - name: Wait for Vercel production readiness
        run: |
          set -euo pipefail
          STATE=""
          for ATTEMPT in $(seq 1 72); do
            curl --fail-with-body --silent --show-error \
              --url "https://api.vercel.com/v13/deployments/${{ steps.deploy.outputs.id }}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              > /tmp/vercel-state.json
            STATE=$(node -e "const j=require('/tmp/vercel-state.json'); console.log(j.readyState || j.status || '')")
            echo "Vercel state: $STATE"
            if [ "$STATE" = "READY" ]; then break; fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "BLOCKED" ]; then
              cat /tmp/vercel-state.json
              exit 1
            fi
            sleep 10
          done
          test "$STATE" = "READY"

      - name: Move Juneau domains to dedicated project
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --url "https://api.vercel.com/v1/domains/juneauflightdeck.com/project-domains?teamId=${VERCEL_ORG_ID}&limit=100" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            > /tmp/juneau-domain-owners.json

          for DOMAIN in juneauflightdeck.com www.juneauflightdeck.com; do
            OWNER=$(DOMAIN="$DOMAIN" node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/juneau-domain-owners.json','utf8'));const d=(j.projectDomains||[]).find(x=>x.name===process.env.DOMAIN);process.stdout.write(d?.projectId||'')")
            if [ -n "$OWNER" ] && [ "$OWNER" != "$VERCEL_PROJECT_ID" ]; then
              curl --fail-with-body --silent --show-error \
                --request POST \
                --url "https://api.vercel.com/v1/projects/${OWNER}/domains/${DOMAIN}/move?teamId=${VERCEL_ORG_ID}" \
                --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                --header "Content-Type: application/json" \
                --data "{\"projectId\":\"${VERCEL_PROJECT_ID}\"}"
            elif [ -z "$OWNER" ]; then
              curl --fail-with-body --silent --show-error \
                --request POST \
                --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
                --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"${DOMAIN}\"}"
            fi
          done

      - name: Pin Juneau domains
        run: |
          for DOMAIN in juneauflightdeck.com www.juneauflightdeck.com; do
            vercel alias set "${{ steps.deploy.outputs.url }}" "$DOMAIN" --token=${{ secrets.VERCEL_TOKEN }} --scope=${VERCEL_TEAM_SLUG}
          done
