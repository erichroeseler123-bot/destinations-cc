name: Deploy DCC Production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/ag-bridge/**'
      - '.github/workflows/deploy-juneauflightdeck.yml'
      - '.github/workflows/deploy-welcometotheswamp.yml'
      - '.github/workflows/deploy-420-airport-pickup.yml'
      - '.github/workflows/deploy-saveonthestrip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dcc-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
      VERCEL_PROJECT_ID: prj_pqvFn6jtJbbVgv1UsAsg3KtMl26s
      DCC_MACHINE_V1: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check if root DCC build is required
        id: check_changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          VERCEL_GIT_COMMIT_SHA="${GITHUB_SHA}" node scripts/vercel-ignore-monorepo.mjs
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "Skipping root DCC deployment because commit only touches isolated sub-apps."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (strict lockfile via npm ci)
        if: steps.check_changed.outputs.should_build == 'true'
        run: npm ci

      - name: Run TypeScript typecheck
        if: steps.check_changed.outputs.should_build == 'true'
        run: npx tsc --noEmit

      - name: Run DCC verification suite against release commit
        if: steps.check_changed.outputs.should_build == 'true'
        run: |
          npx tsx --test tests/dcc/23-entry-surface-parity.test.ts tests/dcc/site-truth.test.ts tests/dcc/satellite-truth-linkage.test.ts tests/dcc/36-discovery-stack.test.ts tests/dcc/81-category-decision-engine-framework.test.ts tests/dcc/82-dcc-machine-layer-v01.test.ts tests/dcc/83-dcc-machine-layer-v02.test.ts tests/dcc/84-dcc-machine-layer-v03.test.ts tests/dcc/85-dcc-machine-layer-v031.test.ts tests/dcc/86-dcc-assurance-commerce-portfolio.test.ts tests/dcc/86-commercial-attribution-and-outcomes.test.ts tests/dcc/87-portfolio-network-and-journeys.test.ts
          node --import tsx --import ./tests/dcc/enable-isolated-db.ts --test tests/dcc/63-octo-production-pilot.test.ts tests/dcc/64-octo-core-lifecycle.test.ts tests/dcc/65-location-octo-integration.test.ts tests/dcc/66-canonical-place-octo.test.ts tests/dcc/67-traveler-order-settlement.test.ts tests/dcc/68-dcc-saga-orchestration.test.ts tests/dcc/69-dcc-square-checkout.test.ts tests/dcc/71-square-webhook-durable-persistence.test.ts tests/dcc/88-operator-acquisition-and-viator-verification.test.ts tests/dcc/89-gosno-rezdy-booking-architecture-proof.test.ts tests/dcc/octo-integration.test.ts

      - name: Install pnpm
        if: steps.check_changed.outputs.should_build == 'true'
        run: npm install -g pnpm@10

      - name: Install Vercel CLI
        if: steps.check_changed.outputs.should_build == 'true'
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        if: steps.check_changed.outputs.should_build == 'true'
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Pull production environment
        if: steps.check_changed.outputs.should_build == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production bound to verified CI run
        if: steps.check_changed.outputs.should_build == 'true'
        shell: bash
        run: |
          set -a
          source .vercel/.env.production.local
          export VERCEL_GIT_COMMIT_SHA="${GITHUB_SHA}"
          export VERCEL_GIT_COMMIT_REF="${GITHUB_REF_NAME}"
          export VERCEL_GIT_PROVIDER="github"
          export DCC_CI_VERIFIED_COMMIT_SHA="${GITHUB_SHA}"
          export DCC_CI_VERIFIED_RUN_ID="${GITHUB_RUN_ID}"
          export DCC_CI_VERIFIED_LOCK_HASH="$(node -e 'const fs=require("fs"),crypto=require("crypto");const b=Buffer.from(fs.readFileSync("package-lock.json","utf8").replace(/\r\n/g,"\n"),"utf8");process.stdout.write(crypto.createHash("sha256").update(b).digest("hex"))')"
          set +a
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        if: steps.check_changed.outputs.should_build == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

