name: Deploy Save On The Strip

on:
  push:
    branches: [main]
    paths:
      - 'apps/saveonthestrip/**'
      - '.github/workflows/deploy-saveonthestrip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-saveonthestrip-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Resolve or create isolated Vercel project
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --output /tmp/save-project.json --write-out '%{http_code}' \
            --url "https://api.vercel.com/v9/projects/saveonthestrip?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          if [ "$STATUS" = "200" ]; then
            PROJECT_ID=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('/tmp/save-project.json','utf8')).id)")
          else
            CREATE_STATUS=$(curl --silent --show-error --output /tmp/save-project-create.json --write-out '%{http_code}' \
              --request POST \
              --url "https://api.vercel.com/v11/projects?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              --header "Content-Type: application/json" \
              --data '{"name":"saveonthestrip","framework":"nextjs","rootDirectory":"apps/saveonthestrip","previewDeploymentsDisabled":true}')
            if [ "$CREATE_STATUS" != "200" ] && [ "$CREATE_STATUS" != "201" ]; then
              cat /tmp/save-project-create.json
              exit 1
            fi
            PROJECT_ID=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('/tmp/save-project-create.json','utf8')).id)")
          fi
          test -n "$PROJECT_ID"
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Using project $PROJECT_ID"

      - name: Lock project to Save app root
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"framework":"nextjs","rootDirectory":"apps/saveonthestrip","sourceFilesOutsideRootDirectory":false,"previewDeploymentsDisabled":true,"commandForIgnoringBuildStep":"node ../../scripts/vercel-ignore-monorepo.mjs"}'

      - name: Ensure Save domains belong to isolated project
        run: |
          set -euo pipefail
          DOMAIN_LIST=$(curl --fail-with-body --silent --show-error \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}&limit=100" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          for DOMAIN in saveonthestrip.com www.saveonthestrip.com; do
            if ! printf '%s' "$DOMAIN_LIST" | DOMAIN="$DOMAIN" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.exit((j.domains||[]).some(d=>d.name===process.env.DOMAIN)?0:1)})"; then
              curl --fail-with-body --silent --show-error \
                --request POST \
                --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
                --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"${DOMAIN}\"}"
            fi
          done

      - name: Create Vercel production deployment from Git
        id: deploy
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"saveonthestrip\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"erichroeseler123-bot\",\"repo\":\"destinations-cc\",\"ref\":\"${GITHUB_SHA}\"},\"projectSettings\":{\"framework\":\"nextjs\",\"rootDirectory\":\"apps/saveonthestrip\",\"sourceFilesOutsideRootDirectory\":false}}" \
            > /tmp/vercel-deployment.json
          DEPLOYMENT_ID=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.id) process.exit(1); console.log(j.id)")
          DEPLOYMENT_URL=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.url) process.exit(1); console.log('https://'+j.url)")
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created $DEPLOYMENT_ID at $DEPLOYMENT_URL"

      - name: Wait for Vercel production readiness
        run: |
          set -euo pipefail
          STATE=""
          for ATTEMPT in $(seq 1 72); do
            curl --fail-with-body --silent --show-error \
              --url "https://api.vercel.com/v13/deployments/${{ steps.deploy.outputs.id }}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              > /tmp/vercel-state.json
            STATE=$(node -e "const j=require('/tmp/vercel-state.json'); console.log(j.readyState || j.status || '')")
            echo "Vercel state: $STATE"
            if [ "$STATE" = "READY" ]; then break; fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "BLOCKED" ]; then
              cat /tmp/vercel-state.json
              exit 1
            fi
            sleep 10
          done
          test "$STATE" = "READY"

      - name: Pin Save On The Strip domains
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" saveonthestrip.com --token=${{ secrets.VERCEL_TOKEN }}
          vercel alias set "${{ steps.deploy.outputs.url }}" www.saveonthestrip.com --token=${{ secrets.VERCEL_TOKEN }}
