name: DCC Machine Layer Verification (v0.1 + v0.2 + v0.3 Canary)

on:
  push:
    branches:
      - main
      - "feat/dcc-machine-layer-*"
  pull_request:
    branches:
      - main

jobs:
  verify-dcc-machine-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DCC_MACHINE_V1: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Golden Master & Machine Layer Test Suite (Tests 36, 81, 82, 83, 84, 85)
        run: npx tsx --test tests/dcc/36-discovery-stack.test.ts tests/dcc/81-category-decision-engine-framework.test.ts tests/dcc/82-dcc-machine-layer-v01.test.ts tests/dcc/83-dcc-machine-layer-v02.test.ts tests/dcc/84-dcc-machine-layer-v03.test.ts tests/dcc/85-dcc-machine-layer-v031.test.ts

      - name: Run 10-Operation Machine Layer v0.3 Benchmarks
        run: npx tsx scripts/dcc/benchmark-machine-layer-v03.ts

      - name: Generate Machine-Readable Verification Manifest
        run: npx tsx scripts/dcc/generate-verification-manifest.ts

