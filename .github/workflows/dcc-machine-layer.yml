name: DCC Machine Layer Verification (v0.1 + v0.2 Canary)

on:
  push:
    branches:
      - main
      - "feat/dcc-machine-layer-*"
  pull_request:
    branches:
      - main

jobs:
  verify-dcc-machine-layer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DCC_MACHINE_V1: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Golden Master & Machine Layer Test Suite (Tests 36, 80, 81, 82, 83)
        run: npx tsx --test tests/dcc/36-juneau-port-day-engine.test.ts tests/dcc/80-category-decision-engine.test.ts tests/dcc/81-category-engine-golden-master.test.ts tests/dcc/82-dcc-machine-layer-v01.test.ts tests/dcc/83-dcc-machine-layer-v02.test.ts

      - name: Run 3-part Machine Layer v0.2 Benchmarks
        run: npx tsx scripts/dcc/benchmark-machine-layer.ts

      - name: Generate Machine-Readable Verification Manifest
        run: npx tsx scripts/dcc/generate-verification-manifest.ts
