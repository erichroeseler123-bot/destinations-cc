name: Deploy Welcome To The Swamp

on:
  push:
    branches: [main]
    paths:
      - 'apps/welcometotheswamp/**'
      - '.github/workflows/deploy-welcometotheswamp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-welcometotheswamp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
      VERCEL_PROJECT_ID: prj_ZY5kkB2QvuIkvJWSGD9IZ0mvhBxx
      VERCEL_TEAM_SLUG: erichroeseler123-bots-projects
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Lock Vercel project to Swamp app root
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"framework":"nextjs","rootDirectory":"apps/welcometotheswamp","sourceFilesOutsideRootDirectory":true,"commandForIgnoringBuildStep":"node ../../scripts/vercel-ignore-monorepo.mjs"}'

      - name: Create Vercel production deployment from exact Git commit
        id: deploy
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"welcometotheswamp\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"erichroeseler123-bot\",\"repo\":\"destinations-cc\",\"ref\":\"${GITHUB_SHA}\"},\"projectSettings\":{\"framework\":\"nextjs\",\"rootDirectory\":\"apps/welcometotheswamp\",\"sourceFilesOutsideRootDirectory\":true}}" \
            > /tmp/vercel-deployment.json
          DEPLOYMENT_ID=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.id) process.exit(1); console.log(j.id)")
          DEPLOYMENT_URL=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.url) process.exit(1); console.log('https://'+j.url)")
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created $DEPLOYMENT_ID at $DEPLOYMENT_URL"

      - name: Wait for Vercel production readiness
        run: |
          set -euo pipefail
          STATE=""
          for ATTEMPT in $(seq 1 72); do
            curl --fail-with-body --silent --show-error \
              --url "https://api.vercel.com/v13/deployments/${{ steps.deploy.outputs.id }}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              > /tmp/vercel-state.json
            STATE=$(node -e "const j=require('/tmp/vercel-state.json'); console.log(j.readyState || j.status || '')")
            echo "Vercel state: $STATE"
            if [ "$STATE" = "READY" ]; then break; fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "BLOCKED" ]; then
              cat /tmp/vercel-state.json
              exit 1
            fi
            sleep 10
          done
          test "$STATE" = "READY"

      - name: Move and pin Swamp production domains
        run: |
          for DOMAIN in welcometotheswamp.com www.welcometotheswamp.com operator.welcometotheswamp.com; do
            vercel domains add "$DOMAIN" welcometotheswamp --force --token=${{ secrets.VERCEL_TOKEN }} --scope=${VERCEL_TEAM_SLUG}
            vercel alias set "${{ steps.deploy.outputs.url }}" "$DOMAIN" --token=${{ secrets.VERCEL_TOKEN }} --scope=${VERCEL_TEAM_SLUG}
          done
