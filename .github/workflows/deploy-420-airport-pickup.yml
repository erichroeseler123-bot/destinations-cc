name: Deploy 420 Airport Pickup

on:
  push:
    branches: [main]
    paths:
      - 'apps/420-airport-pickup/**'
      - '.github/workflows/deploy-420-airport-pickup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-420-airport-pickup-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
      VERCEL_PROJECT_ID: prj_V8SeDn6xhYXvMSUestu5yT2hdbP0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Lock Vercel project to 420 app root
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"framework":"nextjs","rootDirectory":"apps/420-airport-pickup","sourceFilesOutsideRootDirectory":true,"commandForIgnoringBuildStep":"node ../../scripts/vercel-ignore-monorepo.mjs"}'

      - name: Ensure 420 domain belongs to this project
        run: |
          set -euo pipefail
          DOMAIN_LIST=$(curl --fail-with-body --silent --show-error \
            --url "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}&limit=100" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          if ! printf '%s' "$DOMAIN_LIST" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.exit((j.domains||[]).some(d=>d.name==='420friendlyairportpickup.com')?0:1)})"; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              --header "Content-Type: application/json" \
              --data '{"name":"420friendlyairportpickup.com"}'
          fi

      - name: Create Vercel production deployment from Git
        id: deploy
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.vercel.com/v13/deployments?forceNew=1&teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"name\":\"420-airport-pickup\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"erichroeseler123-bot\",\"repo\":\"destinations-cc\",\"ref\":\"${GITHUB_SHA}\"},\"projectSettings\":{\"framework\":\"nextjs\",\"rootDirectory\":\"apps/420-airport-pickup\",\"sourceFilesOutsideRootDirectory\":true}}" \
            > /tmp/vercel-deployment.json
          DEPLOYMENT_ID=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.id) process.exit(1); console.log(j.id)")
          DEPLOYMENT_URL=$(node -e "const j=require('/tmp/vercel-deployment.json'); if(!j.url) process.exit(1); console.log('https://'+j.url)")
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created $DEPLOYMENT_ID at $DEPLOYMENT_URL"

      - name: Wait for Vercel production readiness
        run: |
          set -euo pipefail
          STATE=""
          for ATTEMPT in $(seq 1 72); do
            curl --fail-with-body --silent --show-error \
              --url "https://api.vercel.com/v13/deployments/${{ steps.deploy.outputs.id }}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              > /tmp/vercel-state.json
            STATE=$(node -e "const j=require('/tmp/vercel-state.json'); console.log(j.readyState || j.status || '')")
            echo "Vercel state: $STATE"
            if [ "$STATE" = "READY" ]; then break; fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ] || [ "$STATE" = "BLOCKED" ]; then
              cat /tmp/vercel-state.json
              exit 1
            fi
            sleep 10
          done
          test "$STATE" = "READY"

      - name: Pin 420 production domain
        run: vercel alias set "${{ steps.deploy.outputs.url }}" 420friendlyairportpickup.com --token=${{ secrets.VERCEL_TOKEN }}
