name: Deploy 420 Airport Pickup

on:
  push:
    branches: [main]
    paths:
      - 'apps/420-airport-pickup/**'
      - '.github/workflows/deploy-420-airport-pickup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/420-airport-pickup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-420-airport-pickup-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.head_ref == 'deploy-suite-production-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/420-airport-pickup
    env:
      VERCEL_ORG_ID: team_A35bPkpQ920idHaAvOwWpsSX
      VERCEL_PROJECT_ID: prj_V8SeDn6xhYXvMSUestu5yT2hdbP0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Validate deploy credential
        run: test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
